# Test site: published in a subdirectory, multilingual, with quotes in the title and translations
title: 'L''atelier "test" & co'
baseurl: https://example.com/my-repo/
description: 'Un "site" d''essai'
theme:
  - pwa
language: en
languages:
  - code: en
    name: English
    locale: en_US
  - code: fr
    name: Français
    locale: fr_FR
menus:
  main:
    - id: about
      name: 'About "us"'
      url: /about/
pwa:
  manifest:
    shortcuts: true
    display_override: [window-controls-overlay, standalone]
  serviceworker:
    enabled: true
    ignore:
      - path: "/admin'x"
    install:
      prompt: false
      button: '#install-button'
      precache:
        pages:
          limit: 1
    update:
      snackbar: true
      notification: true
    offline:
      snackbar: true
